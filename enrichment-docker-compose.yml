# Standalone enrichment project. Start after core is healthy.
# --profile enrichment-basic enables YARA, Hygiene and Google DNS (no provider keys).
# Google DNS still queries an external service. Shodan and attribution are opt-in.
name: "${OPENCTI_STACK_NAME:-opencti-fresh}-enrichment"
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  connector-yara:
    image: opencti/connector-yara:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${ENRICHMENT_CONNECTOR_YARA_ID}"
      CONNECTOR_NAME: YARA
      CONNECTOR_SCOPE: Artifact
      CONNECTOR_AUTO: 'true'
      CONNECTOR_LOG_LEVEL: error
      YARA_TLP_LEVEL: clear
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - yara
    - enrichment-basic
  connector-shodan:
    image: opencti/connector-shodan:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${ENRICHMENT_CONNECTOR_SHODAN_ID}"
      CONNECTOR_NAME: Shodan
      CONNECTOR_SCOPE: ipv4-addr,indicator
      CONNECTOR_AUTO: "${SHODAN_AUTO:-false}"
      CONNECTOR_LOG_LEVEL: info
      SHODAN_TOKEN: "${SHODAN_API:-}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - shodan
  connector-hygiene:
    image: opencti/connector-hygiene:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${ENRICHMENT_CONNECTOR_HYGIENE_ID}"
      HYGIENE_MAX_WORKERS: "${HYGIENE_MAX_WORKERS:-10}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - hygiene
    - enrichment-basic
  connector-google-dns:
    image: opencti/connector-google-dns:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${ENRICHMENT_CONNECTOR_GOOGLE_DNS_ID}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - google-dns
    - enrichment-basic
  connector-attribution-tools:
    image: opencti/connector-attribution-tools:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_ATTRIBUTION_TOOLS_ID}"
      CONNECTOR_NAME: attribution-tools
      CONNECTOR_SCOPE: Incident
      CONNECTOR_AUTO: 'false'
      CONNECTOR_LOG_LEVEL: info
      ATTRIBUTIONTOOLS_MODEL_TRAINING_CRON_UTC: 0 0 * * *
      ATTRIBUTIONTOOLS_N_TRAINING_QUERY_THREADS: '1'
      ATTRIBUTIONTOOLS_DEFAULT_RELATION_CONFIDENCE: '50'
      ATTRIBUTIONTOOLS_AUTOMATIC_RELATION_CREATION: "${ATTRIBUTIONTOOLS_AUTOMATIC_RELATION_CREATION:-false}"
      ATTRIBUTIONTOOLS_RELATION_CREATION_PROBABILITY_TRESHOLD: '0.95'
      ATTRIBUTIONTOOLS_CREATOR_ORG_IDENTITY_ID: "${ATTRIBUTIONTOOLS_CREATOR_ORG_IDENTITY_ID:-}"
    volumes:
    - attribution_tools_data:/opt/opencti-connector-attribution-tools/data/training_data
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - attribution-tools
volumes:
  attribution_tools_data:
networks:
  default:
    external: true
    name: "${OPENCTI_STACK_NAME:-opencti-fresh}_default"
