# Standalone feed project. Requires the network and healthy API created by core.
# All feeds are opt-in: target a service, its profile, or --profile feeds-public.
# Do not merge this file with core using multiple -f arguments.
name: "${OPENCTI_STACK_NAME:-opencti-fresh}-feeds"
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  connector-redflag-domains:
    image: opencti/connector-red-flag-domains:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_REDFLAG_DOMAINS_ID}"
      CONNECTOR_NAME: Red Flag Domains
      CONNECTOR_SCOPE: red-flag-domains
      CONNECTOR_LOG_LEVEL: info
      REDFLAGDOMAINS_URL: https://dl.red.flag.domains/daily/
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - redflag-domains
    - feeds-public
  connector-wiz:
    image: opencti/connector-wiz:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_WIZ_ID}"
      CONNECTOR_NAME: Wiz Cloud Threat LandScape
      CONNECTOR_SCOPE: wiz
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P1D
      WIZ_THREAT_ACTOR_AS_INTRUSION_SET: 'True'
      WIZ_TLP_LEVEL: clear
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - wiz
    - feeds-public
  connector-alienvault:
    image: opencti/connector-alienvault:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_ALIENVAULT_ID}"
      CONNECTOR_NAME: AlienVault
      CONNECTOR_SCOPE: alienvault
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT30M
      ALIENVAULT_BASE_URL: https://otx.alienvault.com
      ALIENVAULT_API_KEY: "${ALIENVAULT_API_KEY:-}"
      ALIENVAULT_TLP: White
      ALIENVAULT_CREATE_OBSERVABLES: 'true'
      ALIENVAULT_CREATE_INDICATORS: 'true'
      ALIENVAULT_PULSE_START_TIMESTAMP: "${ALIENVAULT_PULSE_START_TIMESTAMP:-2026-10-01T00:00:00}"
      ALIENVAULT_REPORT_TYPE: threat-report
      ALIENVAULT_REPORT_STATUS: New
      ALIENVAULT_GUESS_MALWARE: 'true'
      ALIENVAULT_GUESS_CVE: 'true'
      ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES: FileHash-MD5,FileHash-SHA1
      ALIENVAULT_ENABLE_RELATIONSHIPS: 'true'
      ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES: 'true'
      ALIENVAULT_FILTER_INDICATORS: 'false'
      ALIENVAULT_DEFAULT_X_OPENCTI_SCORE: '50'
      ALIENVAULT_X_OPENCTI_SCORE_IP: '60'
      ALIENVAULT_X_OPENCTI_SCORE_DOMAIN: '70'
      ALIENVAULT_X_OPENCTI_SCORE_HOSTNAME: '75'
      ALIENVAULT_X_OPENCTI_SCORE_EMAIL: '70'
      ALIENVAULT_X_OPENCTI_SCORE_FILE: '80'
      ALIENVAULT_X_OPENCTI_SCORE_URL: '80'
      ALIENVAULT_X_OPENCTI_SCORE_MUTEX: '60'
      ALIENVAULT_X_OPENCTI_SCORE_CRYPTOCURRENCY_WALLET: '80'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - alienvault
  connector-cisa-known-exploited-vulnerabilities:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_CISA_KNOWN_EXPLOITED_VULNERABILITIES_ID}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - cisa-known-exploited-vulnerabilities
    - feeds-public
  connector-crowdsec-import:
    image: opencti/connector-crowdsec-import:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_CROWDSEC_IMPORT_ID}"
      CONNECTOR_UPDATE_EXISTING_DATA: 'false'
      CONNECTOR_NAME: CrowdSec Import
      CONNECTOR_SCOPE: IPv4-Addr,IPv6-Addr
      CONNECTOR_CONFIDENCE_LEVEL: '100'
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P1D
      CROWDSEC_KEY: "${CROWDSEC_KEY:-}"
      CROWDSEC_IMPORT_QUERY: behaviors.label:"SSH Bruteforce"
      CROWDSEC_IMPORT_QUERY_SINCE: '24'
      CROWDSEC_ENRICHMENT_THRESHOLD_PER_IMPORT: '2000'
      CROWDSEC_MAX_TLP: TLP:AMBER
      CROWDSEC_TLP_LEVEL: amber
      CROWDSEC_CREATE_NOTE: 'true'
      CROWDSEC_CREATE_SIGHTING: 'true'
      CROWDSEC_VULNERABILITY_CREATE_FROM_CVE: 'true'
      CROWDSEC_CREATE_TARGETED_COUNTRIES_SIGHTINGS: 'false'
      CROWDSEC_INDICATOR_CREATE_FROM: malicious,suspicious,known
      CROWDSEC_ATTACK_PATTERN_CREATE_FROM_MITRE: 'true'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - crowdsec-import
  connector-cyber-campaign-collection:
    image: opencti/connector-cyber-campaign-collection:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_CYBER_CAMPAIGN_COLLECTION_ID}"
      CONNECTOR_NAME: APT & Cybercriminals Campaign Collection
      CONNECTOR_SCOPE: report
      CONNECTOR_RUN_AND_TERMINATE: 'false'
      CONNECTOR_LOG_LEVEL: info
      CYBER_MONITOR_GITHUB_TOKEN: "${CYBER_MONITOR_GITHUB_TOKEN:-}"
      CYBER_MONITOR_FROM_YEAR: "${CYBER_MONITOR_FROM_YEAR:-2026}"
      CYBER_MONITOR_INTERVAL: '4'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - cyber-campaign-collection
  connector-disarm-framework:
    image: opencti/connector-disarm-framework:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_DISARM_FRAMEWORK_ID}"
      CONNECTOR_NAME: DISARM Framework
      CONNECTOR_SCOPE: marking-definition,identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool,report,narrative,event,channel
      CONNECTOR_RUN_AND_TERMINATE: 'false'
      CONNECTOR_LOG_LEVEL: info
      DISARM_FRAMEWORK_URL: https://raw.githubusercontent.com/DISARMFoundation/DISARMframeworks/main/generated_files/DISARM_STIX/DISARM.json
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - disarm-framework
    - feeds-public
  connector-dshield:
    image: opencti/connector-dshield:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_DSHIELD_ID}"
      CONNECTOR_NAME: dshield
      CONNECTOR_SCOPE: dshield
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P1D
      DSHIELD_API_BASE_URL: https://feeds.dshield.org/block.txt
      DSHIELD_TLP_LEVEL: CLEAR
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - dshield
    - feeds-public
  connector-mitre-atlas:
    image: opencti/connector-mitre-atlas:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_MITRE_ATLAS_ID}"
      CONNECTOR_NAME: MITRE ATLAS
      CONNECTOR_SCOPE: identity,attack-pattern,course-of-action,relationship,x-mitre-collection,x-mitre-matrix,x-mitre-tactic
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P7D
      MITRE_ATLAS_URL: https://raw.githubusercontent.com/mitre-atlas/atlas-navigator-data/main/dist/stix-atlas.json
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - mitre-atlas
    - feeds-public
  connector-promptintel:
    image: opencti/connector-promptintel:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_PROMPTINTEL_ID}"
      CONNECTOR_NAME: PromptIntel
      CONNECTOR_SCOPE: promptintel
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT1H
      PROMPTINTEL_API_URL: https://api.promptintel.novahunting.ai/api/v1
      PROMPTINTEL_API_KEY: "${PROMPTINTEL_API_KEY:-}"
      PROMPTINTEL_TLP_LEVEL: clear
      PROMPTINTEL_SEVERITY_FILTER: ''
      PROMPTINTEL_CATEGORY_FILTER: ''
      PROMPTINTEL_IMPORT_START_LIMIT: '5000'
      PROMPTINTEL_IMPORT_LIMIT: '1000'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - promptintel
  connector-malpedia:
    image: opencti/connector-malpedia:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_MALPEDIA_ID}"
      CONNECTOR_NAME: Malpedia
      CONNECTOR_SCOPE: malpedia
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT24H
      MALPEDIA_AUTH_KEY: "${MALPEDIA_AUTH_KEY:-}"
      MALPEDIA_IMPORT_INTRUSION_SETS: 'true'
      MALPEDIA_IMPORT_YARA: 'true'
      MALPEDIA_CREATE_INDICATORS: 'true'
      MALPEDIA_CREATE_OBSERVABLES: 'true'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - malpedia
  connector-malwarebazaar:
    image: opencti/connector-malwarebazaar:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_MALWAREBAZAAR_ID}"
      CONNECTOR_NAME: MalwareBazaar
      CONNECTOR_SCOPE: StixFile
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT50M
      MALWAREBAZAAR_API_BASE_URL: https://mb-api.abuse.ch/api/v1/
      MALWAREBAZAAR_API_KEY: "${MALWAREBAZAAR_API_KEY:-}"
      MALWAREBAZAAR_TLP_LEVEL: clear
      MALWAREBAZAAR_X_OPENCTI_SCORE: '100'
      MALWAREBAZAAR_INCLUDE_TAGS: exe,dll,docm,docx,doc,xls,xlsx,xlsm,js
      MALWAREBAZAAR_INCLUDE_REPORTERS: ''
      MALWAREBAZAAR_LABELS: malware-bazaar
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - malwarebazaar
  connector-ransomwarelive:
    image: opencti/connector-ransomwarelive:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_RANSOMWARELIVE_ID}"
      CONNECTOR_NAME: RansomwareLive
      CONNECTOR_SCOPE: identity,domain-name,location,threat-actor,intrusion-set,campaign,report,relationship
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT12H
      RANSOMWARELIVE_API_BASE_URL: "${RANSOMWARELIVE_API_BASE_URL:-https://api-pro.ransomware.live}"
      RANSOMWARELIVE_API_KEY: "${RANSOMWARELIVE_API_KEY:-}"
      RANSOMWARELIVE_CREATE_THREAT_ACTOR: 'false'
      RANSOMWARELIVE_CREATE_INTRUSION_SET: 'true'
      RANSOMWARELIVE_CREATE_CAMPAIGN: 'false'
      RANSOMWARELIVE_CREATE_REPORT: 'true'
      RANSOMWARELIVE_CREATE_LEAK_SITE_DOMAINS: 'false'
      RANSOMWARELIVE_CREATE_LEAK_POST_REFS: 'false'
      RANSOMWARELIVE_PULL_HISTORY: 'false'
      RANSOMWARELIVE_HISTORY_START_YEAR: '2023'
      RANSOMWARELIVE_MARKING_VALUE: TLP:CLEAR
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - ransomwarelive
  connector-abuse-ssl:
    image: opencti/connector-abuse-ssl:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_ABUSE_SSL_ID}"
      CONNECTOR_NAME: Abuse.ch SSL Blacklist
      CONNECTOR_SCOPE: abusessl
      CONNECTOR_LOG_LEVEL: info
      ABUSESSL_URL: https://sslbl.abuse.ch/blacklist/sslipblacklist.csv
      ABUSESSL_INTERVAL: '360'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - abuse-ssl
    - feeds-public
  connector-abuseipdb-ipblacklist:
    image: opencti/connector-abuseipdb-ipblacklist:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_ABUSEIPDB_IPBLACKLIST_ID}"
      CONNECTOR_NAME: AbuseIPDB IP Blacklist
      CONNECTOR_SCOPE: abuseipdb
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT12H
      ABUSEIPDB_API_KEY: "${ABUSEIP_API:-}"
      ABUSEIPDB_SCORE: '50'
      ABUSEIPDB_LIMIT: '5000'
      ABUSEIPDB_CREATE_INDICATOR: 'true'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - abuseipdb-ipblacklist
  connector-urlhaus-recent-payloads:
    image: opencti/connector-urlhaus-recent-payloads:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_URLHAUS_RECENT_PAYLOADS_ID}"
      CONNECTOR_NAME: URLhaus Recent Payloads
      CONNECTOR_LOG_LEVEL: error
      URLHAUS_RECENT_PAYLOADS_API_URL: https://urlhaus-api.abuse.ch/v1/
      URLHAUS_RECENT_PAYLOADS_API_KEY: "${URLHS_API:-}"
      URLHAUS_RECENT_PAYLOADS_COOLDOWN_SECONDS: '300'
      URLHAUS_RECENT_PAYLOADS_INCLUDE_FILETYPES: exe,dll,docm,docx,doc,xls,xlsx,xlsm,js,xll
      URLHAUS_RECENT_PAYLOADS_INCLUDE_SIGNATURES: ''
      URLHAUS_RECENT_PAYLOADS_SKIP_UNKNOWN_FILETYPES: 'true'
      URLHAUS_RECENT_PAYLOADS_SKIP_NULL_SIGNATURE: 'true'
      URLHAUS_RECENT_PAYLOADS_LABELS: urlhaus
      URLHAUS_RECENT_PAYLOADS_LABELS_COLOR: "#54483b"
      URLHAUS_RECENT_PAYLOADS_SIGNATURE_LABEL_COLOR: "#0059f7"
      URLHAUS_RECENT_PAYLOADS_FILETYPE_LABEL_COLOR: "#54483b"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - urlhaus-recent-payloads
  connector-threatfox:
    image: opencti/connector-threatfox:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_THREATFOX_ID}"
      CONNECTOR_NAME: ThreatFox
      CONNECTOR_SCOPE: threatfox
      CONNECTOR_LOG_LEVEL: error
      THREATFOX_INTERVAL: '3'
      THREATFOX_CSV_URL: https://threatfox-api.abuse.ch/v2/files/exports/${THREATFOX_API_KEY:-}/full.csv.zip
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - threatfox
  connector-urlhaus:
    image: opencti/connector-urlhaus:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_URLHAUS_ID}"
      CONNECTOR_NAME: Abuse.ch URLhaus
      CONNECTOR_SCOPE: urlhaus
      CONNECTOR_LOG_LEVEL: error
      URLHAUS_INTERVAL: '3'
      URLHAUS_CSV_URL: https://urlhaus-api.abuse.ch/v2/files/exports/${URLHS_API:-}/recent.csv
      URLHAUS_DEFAULT_X_OPENCTI_SCORE: '80'
      URLHAUS_IMPORT_OFFLINE: 'true'
      URLHAUS_THREATS_FROM_LABELS: 'true'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - urlhaus
  connector-vxvault:
    image: opencti/connector-vxvault:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_VXVAULT_ID}"
      CONNECTOR_NAME: VX Vault URL list
      CONNECTOR_SCOPE: vxvault
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P3D
      VXVAULT_URL: https://vxvault.net/URL_List.php
      VXVAULT_CREATE_INDICATORS: 'true'
      VXVAULT_SSL_VERIFY: "${VXVAULT_SSL_VERIFY:-true}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - vxvault
    - feeds-public
  connector-phishunt:
    image: opencti/connector-phishunt:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN:?Run python3 scripts/init-env.py first}"
      CONNECTOR_ID: "${CONNECTOR_PHISHUNT_ID}"
      CONNECTOR_NAME: Phishunt
      CONNECTOR_SCOPE: phishunt
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P3D
      PHISHUNT_API_KEY: "${PHISHUNT_API_KEY:-}"
      PHISHUNT_CREATE_INDICATORS: 'true'
      PHISHUNT_DEFAULT_X_OPENCTI_SCORE: '40'
      PHISHUNT_X_OPENCTI_SCORE_DOMAIN: '40'
      PHISHUNT_X_OPENCTI_SCORE_IP: '40'
      PHISHUNT_X_OPENCTI_SCORE_URL: '40'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - phishunt
    - feeds-public
  connector-cve:
    image: opencti/connector-cve:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN}"
      CONNECTOR_ID: "${CONNECTOR_CVE_ID}"
      CONNECTOR_NAME: Common Vulnerabilities and Exposures
      CONNECTOR_SCOPE: cve
      CONNECTOR_LOG_LEVEL: error
      CVE_API_KEY: "${CVE_API_KEY:-}"
      CVE_PULL_HISTORY: 'false'
      CVE_IMPORT_SOFTWARE: 'false'
      CVE_MAINTAIN_DATA: 'true'
      CVE_INTERVAL: '2'
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - cve
  connector-sparta:
    image: opencti/connector-sparta:${OPENCTI_VERSION:-7.261002.0}
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: "${OPENCTI_ADMIN_TOKEN}"
      CONNECTOR_ID: "${CONNECTOR_SPARTA_ID}"
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - sparta
networks:
  default:
    external: true
    name: "${OPENCTI_STACK_NAME:-opencti-fresh}_default"
