# Optional core overlay. Requires Docker Compose >= 2.24.4 for !override.
# Generate the certificate and set OPENCTI_PUBLIC_URL=https://your-host first.
# Always combine with -f core-docker-compose.yml; see docs/HTTPS.md.
services:
  opencti:
    # Remove the original host mapping entirely; Nginx reaches port 8080 internally.
    ports: !override []
    environment:
      APP__HTTPS_CERT__COOKIE_SECURE: 'true'

  nginx:
    image: nginx:${NGINX_VERSION:-1.30.5-alpine}
    environment:
      OPENCTI_PUBLIC_URL: "${OPENCTI_PUBLIC_URL:?Set OPENCTI_PUBLIC_URL to your HTTPS URL}"
      # Substitute only this variable, preserving Nginx's $host/$request_uri/etc.
      NGINX_ENVSUBST_FILTER: '^OPENCTI_PUBLIC_URL$'
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NGINX_CERT_DIR:-./nginx/certs}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      opencti:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
