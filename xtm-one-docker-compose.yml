# OPTIONAL overlay: always combine with -f core-docker-compose.yml first.
# Mirrors Filigran XTM One, including public URL / internal JWT audience fixes.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  pgsql-xtm-one:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: "${XTM_ONE_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${XTM_ONE_POSTGRES_PASSWORD}"
      POSTGRES_DB: xtm_one
    volumes:
    - pgsqlxtmonedata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - pg_isready
      - "-U"
      - "${XTM_ONE_POSTGRES_USER}"
      - "-d"
      - xtm_one
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
  xtm-one:
    image: xtmone/platform:${XTM_ONE_VERSION:-latest}
    environment:
      PLATFORM_MODE: xtm_one
      PLATFORM_REGISTRATION_TOKEN: "${PLATFORM_REGISTRATION_TOKEN}"
      BASE_URL: "${XTM_ONE_PUBLIC_URL:-http://localhost:8090}"
      FRONTEND_URL: "${XTM_ONE_PUBLIC_URL:-http://localhost:8090}"
      ADMIN_EMAIL: "${OPENCTI_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${XTM_ONE_ADMIN_PASSWORD}"
      SECRET_KEY: "${XTM_ONE_SECRET_KEY}"
      DATABASE_URL: postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql-xtm-one:5432/xtm_one
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_BUCKET: "${XTM_ONE_S3_BUCKET:-xtm-one-files}"
      S3_USE_SSL: 'false'
      LOG_LEVEL: "${XTM_ONE_LOG_LEVEL:-info}"
      LOG_FORMAT: "${XTM_ONE_LOG_FORMAT:-json}"
      ENTERPRISE_LICENSE: "${XTM_ONE_ENTERPRISE_LICENSE:-}"
      OPENCTI_API_URL: http://opencti:8080
      XTM_AUTH_ACCEPTED_AUDIENCES: http://xtm-one:4000
    ports:
    - "${OPENCTI_BIND_ADDRESS:-0.0.0.0}:${XTM_ONE_PORT:-8090}:4000"
    depends_on:
      pgsql-xtm-one:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:4000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
  xtm-one-worker:
    image: xtmone/worker:${XTM_ONE_VERSION:-latest}
    environment:
      PLATFORM_MODE: xtm_one
      PLATFORM_REGISTRATION_TOKEN: "${PLATFORM_REGISTRATION_TOKEN}"
      BASE_URL: "${XTM_ONE_PUBLIC_URL:-http://localhost:8090}"
      FRONTEND_URL: "${XTM_ONE_PUBLIC_URL:-http://localhost:8090}"
      ADMIN_EMAIL: "${OPENCTI_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${XTM_ONE_ADMIN_PASSWORD}"
      SECRET_KEY: "${XTM_ONE_SECRET_KEY}"
      DATABASE_URL: postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql-xtm-one:5432/xtm_one
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_BUCKET: "${XTM_ONE_S3_BUCKET:-xtm-one-files}"
      S3_USE_SSL: 'false'
      LOG_LEVEL: "${XTM_ONE_LOG_LEVEL:-info}"
      LOG_FORMAT: "${XTM_ONE_LOG_FORMAT:-json}"
      ENTERPRISE_LICENSE: "${XTM_ONE_ENTERPRISE_LICENSE:-}"
    depends_on:
      xtm-one:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  opencti:
    environment:
      XTM__XTM_ONE_URL: http://xtm-one:4000
      XTM__XTM_ONE_TOKEN: "${PLATFORM_REGISTRATION_TOKEN}"
volumes:
  pgsqlxtmonedata:
